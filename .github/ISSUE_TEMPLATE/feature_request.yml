name: ✨ Feature request
description: Suggest a new component, prop, or capability
title: 'feat: '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that's hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Sketch out the component / prop / event shape you have in mind.
      render: vue
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
