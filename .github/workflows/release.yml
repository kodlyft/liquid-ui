name: Release

on:
  push:
    branches: [main, next, beta]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write # for npm provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip if the commit message contains "[skip ci]" (semantic-release's own commits)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    env:
      RELEASE_AUTH_TOKEN: ${{ secrets.RELEASE_TOKEN != '' && secrets.RELEASE_TOKEN || github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ env.RELEASE_AUTH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/liquid-ui.js || (echo "Missing ESM build" && exit 1)
          test -f dist/liquid-ui.umd.cjs || (echo "Missing UMD build" && exit 1)
          test -f dist/style.css || (echo "Missing styles" && exit 1)
          test -f dist/index.d.ts || (echo "Missing types" && exit 1)

      - name: Semantic Release
        env:
          GH_TOKEN: ${{ env.RELEASE_AUTH_TOKEN }}
          GITHUB_TOKEN: ${{ env.RELEASE_AUTH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          GIT_AUTHOR_NAME: "Liquid UI Bot"
          GIT_AUTHOR_EMAIL: "soundsofnation29@gmail.com"
          GIT_COMMITTER_NAME: "Liquid UI Bot"
          GIT_COMMITTER_EMAIL: "soundsofnation29@gmail.com"
        run: npx semantic-release
